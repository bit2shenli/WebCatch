# WebCatch 主配置
# 修改此文件即可调整运行参数，无需改动代码

# 邮件通知配置
email:
  enabled: true
  smtp_host: "smtp.163.com"          # SMTP 服务器
  smtp_port: 465                     # SMTP 端口（SSL）
  sender: "your_email@163.com"       # TODO: 发件邮箱
  password: "LATDyjDc"         # TODO: 邮箱授权码（非登录密码）
  receiver: "your_email@163.com"     # TODO: 收件邮箱

# 监控全局参数
monitor:
  check_interval: 60                 # 检查间隔（秒）
  test_email_interval: 28800         # 测试邮件间隔（秒），默认 8 小时
  request_timeout: 15                # HTTP 请求超时（秒）
  max_retries: 3                     # 请求失败最大重试次数
  retry_base_delay: 5                # 重试基础延迟（秒），指数退避

# 国考监控专用配置（web_catch_scs）
scs_monitor:
  enabled: true
  check_interval: 300                # 检查间隔（秒），默认 5 分钟
  api_article: "http://dl.scs.gov.cn/api/gkhome/article/{hb01_id}"
  api_others: "http://dl.scs.gov.cn/api/gkhome/others/{hb01_id}"
  hb01_id: "8a81f6d9980207bb0198ab5683670008"  # 2026 年度国考

# Webhook 通知配置（可选，支持企业微信/钉钉/飞书）
webhook:
  enabled: false
  url: ""                                # TODO: 填入 Webhook 地址
  msg_type: "raw"                         # raw / wechat / dingtalk / feishu

# 日志配置
logging:
  level: "INFO"                      # DEBUG / INFO / WARNING / ERROR
  file: "log/webcatch.log"
  max_bytes: 10485760                # 单个日志文件最大 10MB
  backup_count: 5                    # 保留 5 个历史日志

# 存储路径
storage:
  snapshot_dir: "data/snapshots"
  history_dir: "data/history"
  state_file: "data/state.json"
